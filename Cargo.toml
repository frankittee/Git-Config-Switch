[package]
name = "gcs"
version = "0.4.0"
edition = "2024"
description = "Switch Git identity profiles in the current repository"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
ssh2-config-rs = "0.7"
tempfile = "3.20"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
